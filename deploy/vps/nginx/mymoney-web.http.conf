# Fase 1 de la web (sin certificado todavia): solo responde al desafio de Let's Encrypt.
# nginx-apply.sh sustituye __DOMAIN__ y cambia a mymoney-web.https.conf en cuanto existe el certificado.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
