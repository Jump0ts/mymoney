# Vhost de la API de MyMoney dentro del nginx de travel_agency. nginx-apply.sh sustituye __DOMAIN__.
#
# IMPORTANTE: este nginx es compartido. Un fallo aqui rompe tambien a travel_agency, por eso:
#  - la IP de la API se resuelve en cada peticion (resolver + variable), asi nginx arranca aunque el
#    contenedor de MyMoney este parado (solo MyMoney devolveria 502);
#  - nginx-apply.sh valida con `nginx -t` y revierte si algo no cuadra antes de recargar.

# Limites por IP. 429 en vez del 503 por defecto.
limit_req_zone $binary_remote_addr zone=mymoney_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=mymoney_api:10m rate=10r/s;
limit_req_status 429;

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name __DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    # Es una API JSON: sin cache en ningun intermediario y sin poder incrustarse en ninguna pagina.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    add_header Cache-Control "no-store" always;

    # Las peticiones son JSON pequeno: cuerpos grandes no tienen razon de ser.
    client_max_body_size 100k;

    # Solo los verbos que usa la API.
    if ($request_method !~ ^(GET|POST|PUT|PATCH|DELETE|OPTIONS)$) {
        return 405;
    }

    resolver 127.0.0.11 valid=10s ipv6=off;

    # Comprobacion de salud para monitorizacion (no revela datos).
    location = /health {
        set $mymoney_upstream http://mymoney-api:4000;
        proxy_pass $mymoney_upstream;
        include /etc/nginx/conf.d/mymoney-proxy.inc;
    }

    # Entrada/registro: freno de fuerza bruta (10 intentos por minuto y por IP, con una pequena rafaga).
    location /api/auth/ {
        limit_req zone=mymoney_auth burst=5 nodelay;
        set $mymoney_upstream http://mymoney-api:4000;
        proxy_pass $mymoney_upstream;
        include /etc/nginx/conf.d/mymoney-proxy.inc;
    }

    location /api/ {
        limit_req zone=mymoney_api burst=40 nodelay;
        set $mymoney_upstream http://mymoney-api:4000;
        proxy_pass $mymoney_upstream;
        include /etc/nginx/conf.d/mymoney-proxy.inc;
    }

    # Cualquier otra ruta no existe: nada de paginas por defecto ni listados.
    location / {
        return 404;
    }
}
