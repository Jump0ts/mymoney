# Vhost de la web de MyMoney dentro del nginx de travel_agency. nginx-apply.sh sustituye __DOMAIN__.
# Este nginx solo hace TLS, limita peticiones y reenvia al contenedor `web`, que sirve los ficheros y pone las
# cabeceras de seguridad (aqui NO se anade ninguna: saldrian duplicadas).
#
# IMPORTANTE: este nginx es compartido. Igual que en el vhost de la API, la IP del contenedor se resuelve en cada
# peticion (resolver + variable): si el contenedor `web` esta parado nginx arranca igual y solo MyMoney da 502.

# Limite por IP: una carga de la web son unas decenas de ficheros, asi que el margen es generoso.
limit_req_zone $binary_remote_addr zone=mymoney_web:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name __DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    # 429 en vez del 503 por defecto (se declara aqui y no en http{} porque el vhost de la API ya lo hace).
    limit_req_status 429;

    # Es una web estatica: no hay cuerpos de peticion y solo se lee.
    client_max_body_size 1k;
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        limit_req zone=mymoney_web burst=100 nodelay;
        set $mymoney_web_upstream http://mymoney-web:8080;
        proxy_pass $mymoney_web_upstream;
        include /etc/nginx/conf.d/mymoney-web-proxy.inc;
    }
}
