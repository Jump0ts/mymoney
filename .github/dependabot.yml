# Dependabot: security alerts and security updates are enabled in the repository settings; this file adds
# regular version updates. Dependabot reads it from the default branch (master), but its pull requests
# target `pre`, following the branch flow (feature -> pre -> release -> master).
version: 2
updates:
  # JavaScript dependencies of the monorepo (backend + app share the root package-lock.json)
  - package-ecosystem: npm
    directory: "/"
    target-branch: pre
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # The Expo/React Native stack is pinned by the Expo SDK (peer ranges such as reanimated <-> worklets
      # break `npm ci` when one package moves alone), so it is upgraded by hand with `npx expo install --fix`.
      - dependency-name: "expo"
      - dependency-name: "expo-*"
      - dependency-name: "@expo/*"
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "react-native"
      - dependency-name: "react-native-*"
      - dependency-name: "@react-native/*"
      # Tambien van ligados al SDK de Expo / a la version de React: eslint-config-expo (la 58 es para el SDK 58) y
      # react-test-renderer (debe ser exactamente la misma version que react).
      - dependency-name: "eslint-config-expo"
      - dependency-name: "react-test-renderer"
      # Saltos mayores de librerias que tocan la validacion de toda la API o todos los formularios, y la migracion
      # de Prisma 7: se hacen a proposito y probando a mano, no como actualizacion automatica.
      - dependency-name: "zod"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@hookform/resolvers"
        update-types: ["version-update:semver-major"]
      - dependency-name: "prisma"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@prisma/client"
        update-types: ["version-update:semver-major"]

  # GitHub Actions (also keeps the commit-SHA pins in the deploy workflow up to date)
  - package-ecosystem: github-actions
    directory: "/"
    target-branch: pre
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns: ["*"]

  # Base image of the API
  - package-ecosystem: docker
    directory: "/backend"
    target-branch: pre
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(docker)"
    ignore:
      # Node moves between LTS lines by hand (.nvmrc and CI stay in sync); odd-numbered releases are not LTS.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  # Postgres image used by the compose files
  - package-ecosystem: docker-compose
    directories: ["/deploy", "/deploy/vps"]
    target-branch: pre
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(docker)"
    ignore:
      # A major Postgres upgrade needs a dump/restore of the data volume, never an automatic image bump.
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
