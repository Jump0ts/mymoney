name: CI

on:
  pull_request:

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mymoney
          POSTGRES_PASSWORD: mymoney
          POSTGRES_DB: mymoney_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mymoney"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://mymoney:mymoney@localhost:5432/mymoney_test
      JWT_SECRET: ci-test-secret-please-change-me
      NODE_ENV: test
      CORS_ORIGINS: http://localhost:8081
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - run: npm ci
        working-directory: .

      - run: npx prisma generate

      - run: npx prisma migrate deploy

      - run: npm run lint

      - run: npm run typecheck

      - run: npm run build

      - run: npm run test

      - name: Coverage summary
        if: always()
        run: cat coverage/coverage-summary.json >> "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage

  mobile:
    name: App móvil (Expo)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - run: npm ci
        working-directory: .

      - run: npm run lint

      - run: npm run typecheck

      - run: npm run test

      - run: npx expo export --platform web

      - name: Cabeceras de seguridad de la web (CSP con hashes)
        env:
          EXPO_PUBLIC_API_URL: https://api.example.dev
        run: |
          node scripts/web-headers.js
          grep -q "script-src 'self' 'sha256-" dist/_headers
          ! grep -q "unsafe-eval" dist/_headers
          grep -q "connect-src 'self' https://api.example.dev;" dist/_headers

      - name: Coverage summary
        if: always()
        run: cat coverage/coverage-summary.json >> "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mobile-coverage
          path: apps/mobile/coverage

  scripts:
    name: Scripts de despliegue
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: shellcheck
        run: shellcheck deploy/backup/*.sh deploy/vps/*.sh deploy/vps/bin/*.sh

      - name: Pruebas de los backups
        run: bash deploy/backup/backup.test.sh

      - name: Pruebas del despliegue en el VPS
        run: bash deploy/vps/vps.test.sh

  docker:
    name: Imagen del backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mymoney
          POSTGRES_PASSWORD: mymoney
          POSTGRES_DB: mymoney_smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mymoney"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://mymoney:mymoney@localhost:5432/mymoney_smoke
    steps:
      - uses: actions/checkout@v7

      - name: Construir la imagen (API + web)
        run: docker build -f backend/Dockerfile --build-arg WEB_API_URL=https://mymoney-api.example.dev -t mymoney-api:ci .

      - name: No lleva secretos ni ficheros sobrantes
        run: |
          docker run --rm --entrypoint sh mymoney-api:ci -c '
            test -x /opt/deploy/deploy.sh
            test -f /opt/deploy/backup/backup.sh
            ! ls -A /opt/deploy | grep -E "^\.env\.production$"
            ! find /app -name ".env" -o -name "*.pem" -o -name "*.key" | grep .
          '

      - name: La web viaja en la imagen y su servidor arranca con las restricciones de produccion
        run: |
          CID=$(docker create mymoney-api:ci)
          docker cp "$CID:/opt/deploy/." "$RUNNER_TEMP/bundle"
          docker rm "$CID"
          cd "$RUNNER_TEMP/bundle"

          # Ficheros: la web, la config generada (sin marcador), la CSP con el origen de la API, y nada de _headers.
          test -f web/index.html
          test -f web-nginx/nginx.conf
          ! grep -q '__CSP__' web-nginx/nginx.conf
          grep -q "connect-src 'self' https://mymoney-api.example.dev;" web-nginx/nginx.conf
          [ ! -e web/_headers ]

          # La config es valida y el servidor arranca sin root, en solo lectura y sin capabilities.
          RUN_WEB="--user 101:101 --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges:true"
          MOUNTS="-v $PWD/web-nginx/nginx.conf:/etc/nginx/nginx.conf:ro -v $PWD/web:/usr/share/nginx/html:ro"
          # shellcheck disable=SC2086
          docker run --rm $RUN_WEB $MOUNTS nginx:1.31-alpine nginx -t
          # shellcheck disable=SC2086
          docker run -d --name web -p 8081:8080 $RUN_WEB $MOUNTS nginx:1.31-alpine
          for i in $(seq 1 15); do curl -fsS http://localhost:8081/healthz >/dev/null && break; sleep 1; done

          code() { curl -s -o /dev/null -w '%{http_code}' "$@"; }
          [ "$(code http://localhost:8081/healthz)" = 200 ]
          [ "$(code http://localhost:8081/)" = 200 ]
          [ "$(code http://localhost:8081/login)" = 200 ]
          [ "$(code http://localhost:8081/edit-transaction/abc123)" = 200 ]   # ruta dinamica -> index.html
          [ "$(code http://localhost:8081/no/existe)" = 200 ]
          [ "$(code http://localhost:8081/_expo/static/js/web/no-existe.js)" = 404 ]   # fichero estatico inexistente
          [ "$(code http://localhost:8081/.env)" = 404 ]
          [ "$(code -X POST http://localhost:8081/login)" = 405 ]
          [ "$(docker exec web id -u)" != "0" ] || { echo "la web corre como root"; exit 1; }

          # Cada cabecera de seguridad sale UNA vez.
          HEADERS=$(curl -sI http://localhost:8081/login | tr -d '\r')
          for H in content-security-policy x-content-type-options x-frame-options referrer-policy cross-origin-opener-policy \
                   permissions-policy strict-transport-security cache-control; do
            [ "$(grep -ic "^$H:" <<<"$HEADERS")" = "1" ] || { echo "cabecera $H ausente o duplicada"; echo "$HEADERS"; exit 1; }
          done
          grep -qi '^content-type: text/html' <<<"$HEADERS"
          JS=$(cd web && find _expo/static/js/web -name '*.js' | head -1)
          curl -sI "http://localhost:8081/$JS" | grep -qi '^cache-control:.*immutable'

      - name: Migraciones con la CLI de la imagen (sin red)
        run: |
          docker run --rm --network host -e DATABASE_URL \
            mymoney-api:ci npx --no-install prisma migrate deploy

      - name: Arrancar con las mismas restricciones que en produccion
        run: |
          docker run -d --name api --network host \
            --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges:true \
            -e NODE_ENV=production -e PORT=4000 -e DATABASE_URL \
            -e JWT_SECRET=ci-jwt-secret-que-no-es-secreto-0123456789 \
            -e CORS_ORIGINS=https://mymoney.example.dev \
            -e REGISTRATION_ENABLED=false \
            mymoney-api:ci
          for i in $(seq 1 30); do
            STATUS=$(docker inspect -f '{{.State.Health.Status}}' api)
            [ "$STATUS" = healthy ] && break
            sleep 2
          done
          echo "estado: $STATUS"
          [ "$STATUS" = healthy ] || { docker logs api; exit 1; }

      - name: Comprobaciones de seguridad
        run: |
          curl -fsS http://localhost:4000/health | grep -q '"status":"ok"'
          [ "$(docker exec api id -u)" != "0" ] || { echo "el contenedor corre como root"; exit 1; }
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:4000/api/auth/register \
            -H 'Content-Type: application/json' \
            -d '{"name":"Ana","email":"ana@example.dev","password":"password123"}')
          [ "$CODE" = "403" ] || { echo "el registro deberia estar cerrado (403) y dio $CODE"; exit 1; }
          CODE=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:4000/api/budgets/groups)
          [ "$CODE" = "401" ] || { echo "sin token deberia ser 401 y dio $CODE"; exit 1; }

      - name: Logs si algo falla
        if: failure()
        run: |
          docker logs api || true
          docker logs web || true
